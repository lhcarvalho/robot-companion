name: BOM structure checks
on:
  pull_request:
    paths: ['bom/**','scripts/verify_bom.py','.github/workflows/bom-validation.yml']
  push:
    branches: [main]
    paths: ['bom/**','scripts/verify_bom.py','.github/workflows/bom-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate BOM consistency
        run: python3 scripts/verify_bom.py
